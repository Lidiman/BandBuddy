name: bandbuddy



services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-bandbuddy}
      MYSQL_PASSWORD: ${DB_PASSWORD:-bandbuddy_secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
      MYSQL_USER: app
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-bandbuddy}
      DB_USERNAME: ${DB_USERNAME:-bandbuddy}
      DB_PASSWORD: ${DB_PASSWORD:-bandbuddy_secret}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local
      YTMUSIC_PYTHON_PATH: python/.venv/bin/python3
    volumes:
      - appdata:/app/storage
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  queue:
    build: .
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    env_file: .env
    environment:
      APP_ENV: production
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-bandbuddy}
      DB_USERNAME: ${DB_USERNAME:-bandbuddy}
      DB_PASSWORD: ${DB_PASSWORD:-bandbuddy_secret}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local
      YTMUSIC_PYTHON_PATH: python/.venv/bin/python3
    volumes:
      - appdata:/app/storage
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
  appdata: